<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gradEtl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="gradSolr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="gradStorage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#gradBg)" rx="16" />

  <!-- ETL Pipeline Background Box -->
  <rect x="40" y="40" width="920" height="200" fill="#1e293b" stroke="#334155" stroke-width="2" rx="12" filter="url(#shadow)" />
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#94a3b8">ETL Pipeline (47M Articles - 94% Retention)</text>

  <!-- Solr Upload Pipeline Background Box -->
  <rect x="40" y="270" width="920" height="300" fill="#1e293b" stroke="#334155" stroke-width="2" rx="12" filter="url(#shadow)" />
  <text x="60" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#94a3b8">Vector Upload &amp; Solr Integration (Server Constraints)</text>

  <!-- ETL Nodes -->
  <!-- Remote DB -->
  <rect x="80" y="100" width="160" height="80" rx="8" fill="url(#gradEtl)" filter="url(#shadow)" />
  <text x="160" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Remote MySQL</text>
  <text x="160" y="155" font-family="Arial, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">(47M+ Articles)</text>

  <!-- SSH Tunnel -->
  <path d="M 240 140 L 320 140" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,6" fill="none" />
  <text x="280" y="130" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">SSH Tunnel</text>

  <!-- Chunk Filter -->
  <rect x="320" y="100" width="160" height="80" rx="8" fill="url(#gradEtl)" filter="url(#shadow)" />
  <text x="400" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Chunk Processor</text>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">(Subscription Check)</text>

  <!-- Arrow -->
  <path d="M 480 140 L 560 140" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />

  <!-- Parquet Storage -->
  <rect x="560" y="100" width="160" height="80" rx="8" fill="url(#gradStorage)" filter="url(#shadow)" />
  <text x="640" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Parquet Files</text>
  <text x="640" y="155" font-family="Arial, sans-serif" font-size="12" fill="#fde68a" text-anchor="middle">(~94% of 47M Records)</text>

  <!-- Solr Integration Nodes -->
  
  <path d="M 640 180 L 640 230 L 160 230 L 160 380" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowhead)" />
  <text x="380" y="220" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b">Batch Iteration (Pandas &amp; PyArrow)</text>

  <!-- Embedding Model -->
  <rect x="80" y="380" width="160" height="80" rx="8" fill="#10b981" filter="url(#shadow)" />
  <text x="160" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">BGE Model</text>
  <text x="160" y="435" font-family="Arial, sans-serif" font-size="12" fill="#d1fae5" text-anchor="middle">(Vectors Generated)</text>

  <!-- Query Flow -->
  <path d="M 240 420 L 320 420" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />

  <!-- Quantization -->
  <rect x="320" y="380" width="160" height="80" rx="8" fill="#8b5cf6" filter="url(#shadow)" />
  <text x="400" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">8-Bit Quantization</text>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="12" fill="#e0e7ff" text-anchor="middle">(NumPy Clip/Round)</text>

  <!-- Arrow -->
  <path d="M 480 420 L 560 420" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />

  <!-- Upload Script -->
  <rect x="560" y="380" width="160" height="80" rx="8" fill="#6366f1" filter="url(#shadow)" />
  <text x="640" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">HTTP POST (JSON)</text>
  <text x="640" y="435" font-family="Arial, sans-serif" font-size="12" fill="#e0e7ff" text-anchor="middle">(Batch size 5000)</text>

  <!-- Arrow -->
  <path d="M 720 420 L 800 420" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />

  <!-- Apache Solr -->
  <rect x="800" y="380" width="160" height="80" rx="8" fill="url(#gradSolr)" filter="url(#shadow)" />
  <text x="880" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Apache Solr</text>
  <text x="880" y="435" font-family="Arial, sans-serif" font-size="12" fill="#fecaca" text-anchor="middle">(Existing Server)</text>
  
  <text x="880" y="475" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">HNSW + 8-bit Graph</text>
  <text x="880" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">(1.5 GB RAM)</text>

  <!-- Arrow Head Defs -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

</svg>
